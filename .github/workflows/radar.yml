name: radar

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Form D filings
        run: python3 form_d.py --days 7 --max 80 --tech-only --out startups.csv

      - name: Fetch YC companies
        run: python3 yc.py --recent 2 --out yc.csv

      - name: Enrich Form D companies with guessed websites
        run: python3 enrich.py

      - name: Build dashboard
        run: python3 dashboard.py

      - name: Fetch IPO pipeline
        run: python3 ipo.py --days 30

      - name: Fetch Form C crowdfunding
        run: python3 formc.py --days 60

      - name: Fetch IPO fundamentals
        run: python3 fundamentals.py

      - name: Fetch 8-K events
        run: python3 events.py

      - name: Fetch news feed
        run: python3 news.py

      - name: Fetch macro (Treasury yields)
        run: python3 macro.py

      - name: Build overview
        run: python3 overview.py

      - name: Commit updated seen state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json state/ipo_seen.json state/events_seen.json state/formc_seen.json
          git commit -m "update seen state [skip ci]" || echo "no changes to commit"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
